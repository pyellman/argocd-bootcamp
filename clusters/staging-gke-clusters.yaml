# cluster.name and cluster.server are direct alternatives, can use either in appset manifest
cluster:
  # must match ArgoCD an cluster name
  name: debian-k8s
  # for applicationset names generally
  friendlyName: "debian-k8s"
  # use https://kubernetes.default.svc for local argo
  server: https://192.168.1.177:6443

# themes for common and shared values
themes:
  environment: staging
  #role: ci
  #provider: baremetal|gke|aws
  provider: gke
# workloads opt-in as inventory
workloads:
  train-schedule: deployed
  echo-server: deployed
