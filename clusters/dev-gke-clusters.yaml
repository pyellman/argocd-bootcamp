# author had 3 clusters (dev, staging and in-cluster), I have two, in-cluster and debian-k8s,
# so I point to in-cluster in this file
cluster:
  # cluster.name and cluster.server are direct alternatives, can use either in appset manifest
  # name: must match a cluster name in ArgoCD
  # name: dev
  name: in-cluster
  # for applicationset names generally (sic: nonsense, it _may_ be used when generating a prefix
  # for the _application_ name by the go templating in the appset manifest if name not "in-cluster" - PY)
  friendlyName: "doesn't matter here, name: in-cluster takes precedence in go-templating of applicationset"
  # friendlyName: "debian-k3s"
  # server: https://34.67.23.222
  # use https://kubernetes.default.svc for my local argo, I didn't create a third cluster - PY
  server: https://kubernetes.default.svc

# themes for common and shared values
themes:
  environment: dev
  # role: ci
  # provider: baremetal|gke|aws
  provider: gke
# workloads opt-in as inventory
workloads:
  train-schedule: deployed
  external-secrets: deployed
  echo-server: deployed
