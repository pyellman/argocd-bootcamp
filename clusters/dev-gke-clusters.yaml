# cluster.name and cluster.server are direct alternatives, can use either in appset manifest
cluster:
  # must match a cluster name in ArgoCD
  name: in-cluster
  # for applicationset name prefix
  # friendlyName: "in-cluster"
  # friendlyName: "debian-k3s"
  # In this cluster def I'll point to https://kubernetes.default.svc to deploy to my local argo, I didn't create a third cluster - PY
  server: https://kubernetes.default.svc

# themes for common and shared values
themes:
  environment: dev
  #role: ci
  #provider: baremetal|gke|aws
  provider: gke
# workloads opt-in as inventory
workloads:
  train-schedule: deployed
  external-secrets: deployed
  echo-server: deployed
